<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin – El Remanso</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Arial, sans-serif; background: #f0f4f0; }
    .topbar { background: #1a6b45; color: white; padding: 15px 25px; display: flex; justify-content: space-between; align-items: center; }
    .topbar h1 { font-size: 1.2rem; }
    .topbar a { color: white; text-decoration: none; font-size: 0.9rem; }
    .container { max-width: 900px; margin: 30px auto; padding: 0 20px; }
    .seccion { background: white; border-radius: 12px; padding: 25px; margin-bottom: 25px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
    .seccion h2 { color: #1a6b45; margin-bottom: 20px; font-size: 1.1rem; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; }
    .card { border: 2px solid #e0e0e0; border-radius: 10px; overflow: hidden; }
    .foto-zona { height: 160px; background: #f5f5f5; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; cursor: pointer; }
    .foto-zona:hover { background: #e8f5ee; }
    .foto-zona img { width: 100%; height: 100%; object-fit: cover; position: absolute; top: 0; left: 0; }
    .foto-zona .overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.5); display: flex; flex-direction: column; align-items: center; justify-content: center; color: white; opacity: 0; transition: opacity 0.2s; font-size: 0.9rem; }
    .foto-zona:hover .overlay { opacity: 1; }
    .foto-zona input[type=file] { display: none; }
    .info { padding: 12px; }
    .info label { font-size: 0.75rem; color: #888; display: block; margin-bottom: 2px; }
    .info input, .info textarea { width: 100%; border: 1.5px solid #e0e0e0; border-radius: 6px; padding: 7px 10px; font-size: 0.88rem; margin-bottom: 8px; font-family: inherit; }
    .info input:focus, .info textarea:focus { outline: none; border-color: #1a6b45; }
    .info textarea { resize: none; height: 70px; }
    .btn { display: inline-block; padding: 10px 22px; border-radius: 8px; border: none; cursor: pointer; font-size: 0.9rem; font-weight: bold; }
    .btn-verde { background: #1a6b45; color: white; }
    .btn-verde:hover { background: #145438; }
    .btn-rojo { background: #dc2626; color: white; font-size: 0.8rem; padding: 6px 12px; border-radius: 6px; border: none; cursor: pointer; }
    .campo { margin-bottom: 15px; }
    .campo label { display: block; font-size: 0.85rem; color: #555; margin-bottom: 5px; }
    .campo input { width: 100%; border: 1.5px solid #e0e0e0; border-radius: 8px; padding: 10px 12px; font-size: 0.95rem; }
    .campo input:focus { outline: none; border-color: #1a6b45; }
    .instrucciones { background: #fffbeb; border: 1.5px solid #f59e0b; border-radius: 10px; padding: 15px 20px; font-size: 0.88rem; line-height: 1.8; }
    pre { background: #1e293b; color: #e2e8f0; padding: 10px 14px; border-radius: 6px; margin: 8px 0; font-size: 0.85rem; }
  </style>
</head>
<body>

<div class="topbar">
  <h1>🌴 El Remanso — Panel Admin</h1>
  <a href="https://elremanso-tonsupa.netlify.app" target="_blank">Ver sitio →</a>
</div>

<div class="container">

  <div class="seccion">
    <h2>🛏️ Habitaciones — Fotos y Textos</h2>
    <div class="grid" id="grid"></div>
    <div style="margin-top:20px; display:flex; gap:10px; align-items:center;">
      <button class="btn btn-verde" onclick="guardar()">💾 Guardar cambios</button>
      <button class="btn" style="background:#e0e0e0" onclick="agregar()">➕ Agregar habitación</button>
      <span id="msg" style="color:#1a6b45; font-size:0.9rem; display:none"></span>
    </div>
  </div>

  <div class="seccion">
    <h2>⚙️ Información General</h2>
    <div style="display:grid; grid-template-columns:1fr 1fr; gap:15px;">
      <div class="campo">
        <label>WhatsApp</label>
        <input type="tel" id="wa" placeholder="593963560568"/>
      </div>
      <div class="campo">
        <label>Instagram</label>
        <input type="url" id="ig" placeholder="https://instagram.com/elremanso"/>
      </div>
      <div class="campo" style="grid-column:1/-1">
        <label>Google Maps (link)</label>
        <input type="url" id="maps" placeholder="https://maps.google.com/?q=..."/>
      </div>
    </div>
    <button class="btn btn-verde" onclick="guardarCfg()">💾 Guardar info</button>
  </div>

  <div class="instrucciones">
    <strong>🚀 Para publicar los cambios en el sitio:</strong><br/>
    Abre el terminal de VS Code y escribe:
    <pre>git add .</pre>
    <pre>git commit -m "actualizar contenido"</pre>
    <pre>git push</pre>
    En 2 minutos los cambios aparecen en el sitio web ✅
  </div>

</div>

<script>
let habs = JSON.parse(localStorage.getItem('habs') || 'null') || [
  { id:1, nombre:'Departamento Triple', tipo:'Departamento', desc:'Perfecto para grupos de 3. Literas cómodas, cocina equipada, sala y baño privado.', cap:'3 personas', foto:null },
  { id:2, nombre:'Departamento Doble', tipo:'Departamento', desc:'Ideal para parejas o dos amigos. Mini cocina equipada, sala acogedora y baño privado.', cap:'2 personas', foto:null },
  { id:3, nombre:'Habitación Matrimonial', tipo:'Habitación', desc:'Ambiente íntimo con cama matrimonial, decoración tropical y baño privado completo.', cap:'2 personas', foto:null },
];
let cfg = JSON.parse(localStorage.getItem('cfg') || '{}');

function render() {
  document.getElementById('grid').innerHTML = habs.map(h => `
    <div class="card">
      <div class="foto-zona" onclick="document.getElementById('f${h.id}').click()">
        ${h.foto ? `<img src="${h.foto}"/>` : '<div style="text-align:center"><div style="font-size:2.5rem">🏠</div><div style="font-size:0.85rem;color:#888;margin-top:5px">Clic para subir foto</div></div>'}
        <div class="overlay"><div>📤</div><div>${h.foto?'Cambiar foto':'Subir foto'}</div></div>
        <input type="file" id="f${h.id}" accept="image/*" onchange="cargarFoto(${h.id},this)"/>
      </div>
      <div class="info">
        <label>Nombre</label>
        <input value="${h.nombre}" oninput="upd(${h.id},'nombre',this.value)"/>
        <label>Tipo</label>
        <input value="${h.tipo}" oninput="upd(${h.id},'tipo',this.value)"/>
        <label>Descripción</label>
        <textarea oninput="upd(${h.id},'desc',this.value)">${h.desc}</textarea>
        <label>Capacidad</label>
        <input value="${h.cap}" oninput="upd(${h.id},'cap',this.value)"/>
        <button class="btn-rojo" onclick="borrar(${h.id})">🗑️ Eliminar</button>
      </div>
    </div>
  `).join('');
  document.getElementById('wa').value   = cfg.whatsapp  || '593963560568';
  document.getElementById('ig').value   = cfg.instagram || '';
  document.getElementById('maps').value = cfg.maps      || '';
}

function upd(id, campo, val) { const h = habs.find(h=>h.id===id); if(h) h[campo]=val; }

function cargarFoto(id, input) {
  const file = input.files[0]; if(!file) return;
  const r = new FileReader();
  r.onload = e => { const h = habs.find(h=>h.id===id); if(h){ h.foto=e.target.result; render(); msg('📸 Foto lista — guarda los cambios'); } };
  r.readAsDataURL(file);
}

function borrar(id) { if(!confirm('¿Eliminar?')) return; habs=habs.filter(h=>h.id!==id); render(); }

function agregar() {
  habs.push({ id:Date.now(), nombre:'Nueva habitación', tipo:'Habitación', desc:'Descripción aquí.', cap:'2 personas', foto:null });
  render();
}

function guardar() { localStorage.setItem('habs', JSON.stringify(habs)); msg('✅ ¡Guardado!'); }

function guardarCfg() {
  cfg = { whatsapp: document.getElementById('wa').value, instagram: document.getElementById('ig').value, maps: document.getElementById('maps').value };
  localStorage.setItem('cfg', JSON.stringify(cfg));
  msg('✅ ¡Info guardada!');
}

function msg(t) { const el=document.getElementById('msg'); el.textContent=t; el.style.display='inline-block'; setTimeout(()=>el.style.display='none',3000); }

render();
</script>
</body>
</html>
